name: Profile and brand integrity

on:
  pull_request:
    paths:
      - "**/*.md"
      - "brand/**"
      - "profile/**"
      - "tools/verify_brand_profile.py"
      - ".github/workflows/profile-brand-qa.yml"
  push:
    branches:
      - "brand/tandemvector-profile"
    paths:
      - "**/*.md"
      - "brand/**"
      - "profile/**"
      - "tools/verify_brand_profile.py"
      - ".github/workflows/profile-brand-qa.yml"

permissions:
  contents: read

jobs:
  verify-profile-and-artwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out source (pinned action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate fail-closed test fixtures
        run: python3 tools/verify_brand_profile.py --self-test

      - name: Verify public brand assets, accessible cards, and local references
        run: python3 tools/verify_brand_profile.py

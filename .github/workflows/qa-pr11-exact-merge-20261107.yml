name: PR11 exact-merge source QA (temporary, no promotion)

on:
  push:
    branches:
      - qa/pr11-exact-merge-hosted-20261107

permissions:
  contents: read

jobs:
  verify-exact-merge:
    name: Source validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out the exact proposed GitHub merge commit, not QA overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 62f2b05786062d61d9a7d92c90e279429cdadfef
          persist-credentials: false
          fetch-depth: 1
      - name: Fail closed if the source commit moved
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "62f2b05786062d61d9a7d92c90e279429cdadfef"
          test -f tools/verify_brand_profile.py
      - name: Set up Python from a pinned trusted action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run canonical brand/self-test directly on exact merge source
        shell: bash
        run: |
          python tools/verify_brand_profile.py --self-test
          python tools/verify_brand_profile.py

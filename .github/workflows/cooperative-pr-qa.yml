name: Cooperative PR verifier contract

on:
  pull_request:
    paths:
      - "tools/verify_cooperative_pr.py"
      - ".github/workflows/cooperative-pr-qa.yml"

permissions:
  contents: read

jobs:
  verify-cooperative-pr-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source (pinned action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run offline verifier contract tests
        run: python3 -I tools/verify_cooperative_pr.py --self-test

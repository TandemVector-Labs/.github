name: PR11 plus PR13 exact combined source QA (no promotion)

on:
  push:
    branches:
      - qa/pr11-pr13-combined-hosted-20261110

permissions:
  contents: read

jobs:
  verify-exact-combination:
    name: Exact source and brand QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout immutable combined-source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: a5b410587461647f09622c0f4d64f98a17db08bd
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head and tree (no promotion)
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a5b410587461647f09622c0f4d64f98a17db08bd"
          test "$(git rev-parse HEAD^{tree})" = "f48864889ac0ceca3351ec6e0a2d2c1af0e4aaa0"
          test -f tools/verify_brand_profile.py
          test -f .github/workflows/profile-brand-qa.yml
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run selftest and full brand audit on immutable combined source
        shell: bash
        run: |
          python tools/verify_brand_profile.py --self-test
          python tools/verify_brand_profile.py
          echo TVL_COMBINED_QA_PASS
